<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Agentic Payments{% endblock %}</title>
  {% block head_extra %}{% endblock %}
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2e38;
      --text: #e6e8eb;
      --muted: #9aa1ac;
      --accent: #5aa9ff;
      --danger: #ff6b6b;
      --ok: #52c98f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: var(--text); text-decoration: none; font-weight: 600; }
    header nav { display: flex; align-items: center; gap: 0.35rem; }
    header nav a {
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--muted);
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
    }
    header nav a:hover { color: var(--text); }
    header nav a.active { color: var(--text); background: var(--panel); }
    header nav .button { margin-left: 0.65rem; }
    textarea, input[type="text"] {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.7rem;
      font-family: inherit;
      font-size: 1rem;
    }
    button, .button {
      background: var(--accent);
      color: #0b0e14;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .button:hover { opacity: 0.9; }
    .button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .stats { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      min-width: 150px;
    }
    .stat .label { color: var(--muted); font-size: 0.8rem; }
    .stat .value { font-size: 1.3rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    tr:hover td { background: var(--panel); }
    .grid-table { width: 100%; overflow-x: auto; }
    .grid-row {
      display: grid;
      grid-template-columns: 180px 1fr 100px 100px 100px;
      gap: 0.5rem;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .grid-header { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    a.grid-row, a.row-link { color: var(--text); text-decoration: none; }
    a.grid-row:hover { background: var(--panel); }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.completed { background: rgba(82,201,143,0.15); color: var(--ok); }
    .badge.running { background: rgba(90,169,255,0.15); color: var(--accent); }
    .badge.failed { background: rgba(255,107,107,0.15); color: var(--danger); }
    .event {
      border-left: 3px solid var(--border);
      padding: 0.6rem 1rem;
      margin-bottom: 0.5rem;
      background: var(--panel);
      border-radius: 0 6px 6px 0;
    }
    .event.reasoning { border-left-color: var(--muted); }
    .event.tool_call { border-left-color: var(--accent); }
    .event.payment_executed { border-left-color: var(--ok); }
    .event.payment_blocked, .event.payment_failed { border-left-color: var(--danger); }
    .event.final_answer { border-left-color: #c99cff; }
    .event .kind {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .event .summary { margin-top: 0.2rem; white-space: pre-wrap; }
    .event .meta { margin-top: 0.3rem; font-size: 0.8rem; color: var(--muted); }
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="/">Agentic Payments — Decision Log</a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' or request.url.path.startswith('/runs') else '' }}">Runs</a>
      <a href="/purchases" class="{{ 'active' if request.url.path == '/purchases' else '' }}">Purchases</a>
      <a href="/new" class="button">+ New run</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
